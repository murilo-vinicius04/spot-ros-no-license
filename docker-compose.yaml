services:
  spot-ros2:
    build: .
    volumes:
      - .:/home/spot_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/fastdds_no_shm_profile.xml:/home/spot_ws/fastdds_profile.xml
    working_dir: /home/spot_ws
    environment:
      - SPOT_NAME=${SPOT_NAME:-Spot}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - HOME=/home/spot_ws
      - USER=root
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/spot_ws/fastdds_profile.xml
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash && 
        echo '🎉 Container pronto! Executando comandos manualmente...' &&
        exec bash
      "
    stdin_open: true
    tty: true
    network_mode: host

  zed:
    build:
      context: .
      dockerfile: Dockerfile.zed
    container_name: zed-container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/spot_ws/fastdds_profile.xml
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ./zed_workspace:/root/zed_workspace
      - ./install_zed_wrapper.sh:/root/install_zed_wrapper.sh
      - ./config/fastdds_no_shm_profile.xml:/home/spot_ws/fastdds_profile.xml
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
        bash /root/install_zed_wrapper.sh
        cd /root/zed_workspace
        source install/setup.bash
        source /opt/ros/humble/setup.bash
        echo '🎥 Iniciando ZED Camera...'
        exec ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zed2i
      "
